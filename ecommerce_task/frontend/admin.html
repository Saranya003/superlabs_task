<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Product Management</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    button {
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    th {
      background: #007bff;
      color: white;
    }

    .actions button {
      margin-right: 5px;
    }

    img.preview {
      width: 50px;
      height: 50px;
      object-fit: cover;
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2 id="formTitle">Create Product</h2>

  <form id="createForm">

    <input type="text" id="name" placeholder="Name" required>

    <textarea id="description" placeholder="Description"></textarea>

    <input type="number" id="price" placeholder="Price" required>

    <input type="text" id="sku" placeholder="SKU" required>

    <label>Upload Images</label>
    <input type="file" id="imageFiles" multiple accept="image/*">

    <label>OR Image URLs</label>
    <input type="text" id="imageUrls" placeholder="https://img1.jpg, https://img2.jpg">

    <label>
      <input type="checkbox" id="availability" checked> Available
    </label>

    <button type="submit" id="submitBtn">Add Product</button>

  </form>

  <h2>Product List</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Images</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="productTable"></tbody>
  </table>

</div>

<script>

const API_BASE = "http://localhost:3334/api/v1/admin/products";

let editingProductId = null;

// Auth Header
function getAuthHeaders() {
  return {
    "Authorization": `Bearer ${localStorage.getItem("token")}`
  };
}

// Load Products
async function loadProducts() {
  const res = await fetch(API_BASE, { headers: getAuthHeaders() });
  const data = await res.json();

  const table = document.getElementById("productTable");
  table.innerHTML = "";

  data.data.forEach(p => {

    const imagesHTML = (p.images || []).map(img => {
      const url = img.startsWith("http") ? img : `http://localhost:3334${img}`;
      return `<img src="${url}" class="preview">`;
    }).join("");

    table.innerHTML += `
      <tr>
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>${imagesHTML}</td>
        <td class="actions">
          <button onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
          <button onclick='deleteProduct(${p.id})'>Delete</button>
        </td>
      </tr>
    `;
  });
}

// Submit Form
document.getElementById("createForm").addEventListener("submit", async e => {
  e.preventDefault();

  const files = document.getElementById("imageFiles").files;
  const imageUrls = document.getElementById("imageUrls").value
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);

  let res;

  // 👉 If file upload
  if (files.length > 0) {

    const formData = new FormData();

    formData.append("name", document.getElementById("name").value);
    formData.append("description", document.getElementById("description").value);
    formData.append("price", document.getElementById("price").value);
    formData.append("sku", document.getElementById("sku").value);
    formData.append("availability", document.getElementById("availability").checked);

    for (let i = 0; i < files.length; i++) {
      formData.append("images", files[i]);
    }

    imageUrls.forEach(url => formData.append("imageUrls", url));

    res = await fetch(editingProductId ? `${API_BASE}/${editingProductId}` : API_BASE, {
      method: editingProductId ? "PUT" : "POST",
      headers: getAuthHeaders(),
      body: formData
    });

  } else {

    // 👉 JSON only
    const payload = {
      name: document.getElementById("name").value,
      description: document.getElementById("description").value,
      price: document.getElementById("price").value,
      sku: document.getElementById("sku").value,
      availability: document.getElementById("availability").checked,
      images: imageUrls
    };

    res = await fetch(editingProductId ? `${API_BASE}/${editingProductId}` : API_BASE, {
      method: editingProductId ? "PUT" : "POST",
      headers: {
        ...getAuthHeaders(),
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
  }

  if (!res.ok) {
    alert("Save failed");
    return;
  }

  resetForm();
  loadProducts();
});

// Edit
function editProduct(p) {
  editingProductId = p.id;

  document.getElementById("name").value = p.name;
  document.getElementById("description").value = p.description || "";
  document.getElementById("price").value = p.price;
  document.getElementById("sku").value = p.sku;
  document.getElementById("availability").checked = p.availability;

  document.getElementById("imageUrls").value = (p.images || []).join(", ");

  document.getElementById("formTitle").innerText = "Update Product";
  document.getElementById("submitBtn").innerText = "Update";
}

// Delete
async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  await fetch(`${API_BASE}/${id}`, {
    method: "DELETE",
    headers: getAuthHeaders()
  });

  loadProducts();
}

// Reset
function resetForm() {
  document.getElementById("createForm").reset();
  editingProductId = null;

  document.getElementById("formTitle").innerText = "Create Product";
  document.getElementById("submitBtn").innerText = "Add Product";
}

// Init
loadProducts();

</script>

</body>
</html>
